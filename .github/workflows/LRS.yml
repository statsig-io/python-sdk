name: Long Running SDK CD

on: 
  workflow_dispatch:
  push:
    branches:
      - main

      
env:
  api_key: ${{ secrets.LRS_SERVER_KEY }}
  image_tag: python

jobs:
  CD:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LRS repo
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          repository: statsig-io/long-running-sdk
          ref: main
          token: ${{ secrets.ROIM }}
      - name: Checkout SDK repo
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          repository: statsig-io/private-python-sdk
          ref: main
          token: ${{ secrets.ROIM }}
          path: ./python/private-python-sdk
      - name: Set up QEMU
        uses: docker/setup-qemu-action@27d0a4f181a40b142cce983c5393082c365d1480 # v1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f211e3e9ded2d9377c8cadc4489a4e38014bc4c9 # v1
      - name: Login to DockerHub
        uses: docker/login-action@dd4fa0671be5250ee6f50aedf4cb05514abda2c7 # v1
        with:
          username: statsig
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: python/Dockerfile
          push: true
          tags: statsig/long-running-sdk:${{ env.image_tag }}
          github-token: ${{ secrets.GH_CI_CD_PAT }}
          build-args: 
            secret_key=${{env.api_key}}
          platforms: linux/amd64
            
          
        
